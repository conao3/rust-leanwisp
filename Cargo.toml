[package]
name = "leanwisp"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "A parser-aware Lean 4 source formatter with a Rust layout engine"
repository = "https://github.com/conao3/rust-leanwisp"

[dependencies]
clap = { version = "4", features = ["derive"] }
leanfran = { version = "=0.6.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
libc = "0.2"
toml = "1.2.2"

[build-dependencies]
leanfran-build = "=0.7.0"
